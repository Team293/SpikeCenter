name: PR CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - production
    paths-ignore: []

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 18.x
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TELEMETRY_DISABLED: 1
  # Hard-set staging-like context for builds
  STAGING: true
  ARTIFACT_SUFFIX: -pr

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-if-staging-to-production:
    if: github.event.pull_request.base.ref == 'production' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping PR checks for staging -> production PR."
    outputs:
      skipped: true

  lint:
    if: github.event.pull_request.base.ref != 'production' || github.event.pull_request.head.ref != 'staging'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        run: pnpm run lint

  prebuild:
    if: github.event.pull_request.base.ref != 'production' || github.event.pull_request.head.ref != 'staging'
    name: Prebuild monorepo applications
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: prebuild-pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            prebuild-pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate environment files
        run: |
          set -euo pipefail
          for APP in auth landing learn scout nitro-api; do
            mkdir -p "apps/$APP"
            {
              echo "NODE_ENV=${NODE_ENV}"
              echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
              echo "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
              echo "NEXT_PUBLIC_AUTH_BASE_URL=${NEXT_PUBLIC_AUTH_BASE_URL}"
              echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}"
              echo "NEXT_PUBLIC_DOCS_BASE_URL=${NEXT_PUBLIC_DOCS_BASE_URL}"
              echo "NEXT_PUBLIC_LANDING_BASE_URL=${NEXT_PUBLIC_LANDING_BASE_URL}"
              echo "NEXT_PUBLIC_LEARN_BASE_URL=${NEXT_PUBLIC_LEARN_BASE_URL}"
              echo "NEXT_PUBLIC_SCOUT_BASE_URL=${NEXT_PUBLIC_SCOUT_BASE_URL}"
              echo "NEXT_PUBLIC_ATTENDANCE_BASE_URL=${NEXT_PUBLIC_ATTENDANCE_BASE_URL}"
              echo "CRON_SECURITY_KEY=${CRON_SECURITY_KEY}"
              echo "NODE_TLS_REJECT_UNAUTHORIZED=0"
            } > "apps/$APP/.env"
            cp "apps/$APP/.env" "apps/$APP/.env.production"
            echo "Created env files for $APP"
          done
        env:
          NODE_ENV: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          NEXT_PUBLIC_AUTH_BASE_URL: ${{ secrets.NEXT_PUBLIC_AUTH_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_DOCS_BASE_URL: ${{ secrets.NEXT_PUBLIC_DOCS_BASE_URL }}
          NEXT_PUBLIC_LANDING_BASE_URL: ${{ secrets.NEXT_PUBLIC_LANDING_BASE_URL }}
          NEXT_PUBLIC_LEARN_BASE_URL: ${{ secrets.NEXT_PUBLIC_LEARN_BASE_URL }}
          NEXT_PUBLIC_SCOUT_BASE_URL: ${{ secrets.NEXT_PUBLIC_SCOUT_BASE_URL }}
          NEXT_PUBLIC_ATTENDANCE_BASE_URL: ${{ secrets.NEXT_PUBLIC_ATTENDANCE_BASE_URL }}
          CRON_SECURITY_KEY: ${{ secrets.CRON_SECURITY_KEY }}

      - name: Turbo prebuild all deployable apps
        run: |
          pnpm turbo run build --filter=./apps/auth --filter=./apps/landing --filter=./apps/learn --filter=./apps/scout --filter=./apps/docs --filter=./apps/nitro-api --filter=./apps/attendance

      - name: List built artifacts
        run: |
          ls -1 apps/auth/.next || true
          ls -1 apps/landing/.next || true
          ls -1 apps/learn/.next || true
          ls -1 apps/scout/.next || true
          ls -1 apps/docs/.next || true
          ls -1 apps/nitro-api/.output || true
          ls -1 apps/attendance/.next || true

      - name: Package build artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          for APP in auth landing learn scout docs; do
            if [ -d "apps/$APP/.next" ]; then
              (cd apps/$APP && tar -czf "../../dist-artifacts/next-${APP}${ARTIFACT_SUFFIX}.tgz" .next $( [ -f .env ] && echo .env ) $( [ -f .env.production ] && echo .env.production ))
              echo "Packaged next-${APP}${ARTIFACT_SUFFIX}.tgz"
            else
              echo "Missing .next for $APP" >&2
              exit 1
            fi
          done
          if [ -d "apps/nitro-api/.output" ]; then
            (cd apps/nitro-api && tar -czf "../../dist-artifacts/nitro-api${ARTIFACT_SUFFIX}.tgz" .output $( [ -f .env ] && echo .env ) $( [ -f .env.production ] && echo .env.production ))
            echo "Packaged nitro-api${ARTIFACT_SUFFIX}.tgz"
          else
            echo "Missing .output for nitro-api" >&2
            exit 1
          fi
          ls -lh dist-artifacts

      - name: Upload artifact auth
        uses: actions/upload-artifact@v4
        with:
          name: next-auth${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-auth${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact landing
        uses: actions/upload-artifact@v4
        with:
          name: next-landing${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-landing${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact learn
        uses: actions/upload-artifact@v4
        with:
          name: next-learn${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-learn${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact scout
        uses: actions/upload-artifact@v4
        with:
          name: next-scout${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-scout${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact docs
        uses: actions/upload-artifact@v4
        with:
          name: next-docs${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-docs${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact nitro
        uses: actions/upload-artifact@v4
        with:
          name: nitro-api${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/nitro-api${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact attendance
        uses: actions/upload-artifact@v4
        with:
          name: next-attendance${{ env.ARTIFACT_SUFFIX }}
          path: dist-artifacts/next-attendance${{ env.ARTIFACT_SUFFIX }}.tgz
          if-no-files-found: error
          retention-days: 3

  build-next:
    if: github.event.pull_request.base.ref != 'production' || github.event.pull_request.head.ref != 'staging'
    name: Build Next.js images (prebuilt, no push)
    runs-on: ubuntu-latest
    needs: prebuild
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - app: auth
          - app: landing
          - app: learn
          - app: scout
          - app: docs
          - app: attendance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: next-${{ matrix.app }}${{ env.ARTIFACT_SUFFIX }}
          path: artifact-download

      - name: Extract prebuilt artifact
        run: |
          set -e
          mkdir -p apps/${{ matrix.app }}
          tar -xzf artifact-download/next-${{ matrix.app }}${{ env.ARTIFACT_SUFFIX }}.tgz -C apps/${{ matrix.app }}
          test -d "apps/${{ matrix.app }}/.next" || (echo ".next not extracted" && ls -al apps/${{ matrix.app }} && exit 1)

      - name: Verify prebuilt artifact
        run: |
          if [ ! -f "apps/${{ matrix.app }}/.next/BUILD_ID" ] && [ ! -d "apps/${{ matrix.app }}/.next/server" ]; then
            echo "Prebuilt .next directory for ${{ matrix.app }} appears missing or incomplete."
            ls -al apps/${{ matrix.app }}/.next || true
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image from prebuilt artifacts (no push)
        run: |
          IMAGE=ghcr.io/team293/${{ matrix.app }}
          SHA_TAG=pr-${{ github.sha }}
          echo "Building $IMAGE:$SHA_TAG (no push)"
          docker build \
            --build-arg APP=${{ matrix.app }} \
            --build-arg USE_PREBUILT=true \
            -t $IMAGE:$SHA_TAG \
            -f deploy/next/Dockerfile .
          docker image ls $IMAGE:$SHA_TAG

  build-nitro:
    if: github.event.pull_request.base.ref != 'production' || github.event.pull_request.head.ref != 'staging'
    name: Build nitro-api image (prebuilt, no push)
    runs-on: ubuntu-latest
    needs: prebuild
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt nitro artifact
        uses: actions/download-artifact@v4
        with:
          name: nitro-api${{ env.ARTIFACT_SUFFIX }}
          path: artifact-download-nitro

      - name: Extract nitro artifact
        run: |
          set -e
          mkdir -p apps/nitro-api
          tar -xzf artifact-download-nitro/nitro-api${{ env.ARTIFACT_SUFFIX }}.tgz -C apps/nitro-api
          test -d "apps/nitro-api/.output" || (echo ".output not extracted" && ls -al apps/nitro-api && exit 1)

      - name: Verify nitro artifact
        run: |
          if [ ! -f "apps/nitro-api/.output/server/index.mjs" ]; then
            echo "Nitro .output missing expected server entry."
            find apps/nitro-api/.output -maxdepth 3 -type f | head -n 50
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nitro image from prebuilt artifacts (no push)
        run: |
          IMAGE=ghcr.io/team293/nitro-api
          SHA_TAG=pr-${{ github.sha }}
          echo "Building $IMAGE:$SHA_TAG (no push)"
          docker build \
            --build-arg APP=nitro-api \
            --build-arg USE_PREBUILT=true \
            -t $IMAGE:$SHA_TAG \
            -f deploy/nitro/Dockerfile .
          docker image ls $IMAGE:$SHA_TAG

  summary:
    if: github.event.pull_request.base.ref != 'production' || github.event.pull_request.head.ref != 'staging'
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-next, build-nitro]
    steps:
      - name: Report
        run: |
          echo "PR build completed for commit ${{ github.sha }}"
          echo "Artifacts built with suffix: ${ARTIFACT_SUFFIX}"
