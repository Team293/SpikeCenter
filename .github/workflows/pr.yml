name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs of the same workflow on the same PR ref
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 18.x
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        run: pnpm run lint

  build:
    name: Build Docker Images (no push)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    strategy:
      matrix:
        app: [auth, landing, learn, scout]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (ephemeral, not pushed)
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          TAG=pr-${{ github.sha }}
          echo "Building $IMAGE:$TAG (APP=${{ matrix.app }})"
          docker build \
            --build-arg APP=${{ matrix.app }} \
            -t $IMAGE:$TAG \
            -f Dockerfile .
          docker image ls $IMAGE:$TAG

      - name: Summary
        if: always()
        run: |
          echo "Built image for ${{ matrix.app }} (not pushed)"
