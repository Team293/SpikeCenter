name: Staging CI

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs of the same workflow on the same PR ref
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 18.x
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        run: pnpm run lint

  build:
    name: Build Docker Images (no push)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    strategy:
      matrix:
        app: [auth, landing, learn, scout, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate environment files
        run: |
          set -euo pipefail
          for APP in auth landing learn scout nitro-api; do
            mkdir -p "apps/$APP"
            {
              echo "BETTER_AUTH_URL=${BETTER_AUTH_URL}"
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}"
              echo "NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}"
              echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
              echo "NODE_TLS_REJECT_UNAUTHORIZED=0"
              echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
              echo "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
            } > "apps/$APP/.env"
            cp "apps/$APP/.env" "apps/$APP/.env.production"
            echo "Created env files for $APP"
          done
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}

      - name: Build image (ephemeral, not pushed)
        run: |
          IMAGE=ghcr.io/team293/${{ matrix.app }}
          TAG=pr-${{ github.sha }}
          echo "Building $IMAGE:$TAG (APP=${{ matrix.app }})"
          docker build \
            --build-arg APP=${{ matrix.app }} \
            -t $IMAGE:$TAG \
            -f deploy/next/Dockerfile .
          docker image ls $IMAGE:$TAG

      - name: Build nitro-api image (no push on PR)
        run: |
          IMAGE=ghcr.io/team293/nitro-api
          SHA_TAG=sha-${{ github.sha }}
          echo "Building $IMAGE:$SHA_TAG (nitro-api)"
          docker build -f deploy/nitro/Dockerfile -t $IMAGE:$SHA_TAG .
          docker image ls $IMAGE:$SHA_TAG

      - name: Summary
        if: always()
        run: |
          echo "Built image for ${{ matrix.app }} (not pushed)"
