name: CI

on:
  push:
    branches:
      - production
      - staging

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 18.x
  # Adjust if you want to change Turbo's remote caching later
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        run: pnpm run lint

  build:
    name: Build & (conditionally) Push Docker Images
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    strategy:
      # We need uppercase identifiers for webhook env var lookup but GitHub Actions
      # does not provide toUpper(). Provide an explicit mapping instead.
      matrix:
        include:
          - app: auth
            webhook_key: WEBHOOK_URL_AUTH
          - app: landing
            webhook_key: WEBHOOK_URL_LANDING
          - app: learn
            webhook_key: WEBHOOK_URL_LEARN
          - app: scout
            webhook_key: WEBHOOK_URL_SCOUT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push on PR)
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          SHA_TAG=sha-${{ github.sha }}
          echo "Building $IMAGE:$SHA_TAG (APP=${{ matrix.app }})"
          docker build \
            --build-arg APP=${{ matrix.app }} \
            -t $IMAGE:$SHA_TAG \
            -f Dockerfile .
          docker image ls $IMAGE:$SHA_TAG

      - name: Push image (production/staging pushes)
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          SHA_TAG=sha-${{ github.sha }}
          docker push $IMAGE:$SHA_TAG
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:latest
            docker push $IMAGE:latest
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:staging
            docker push $IMAGE:staging
          fi

      - name: Ping webhook (if configured)
        if: github.event_name == 'push'
        env:
          APP_NAME: ${{ matrix.app }}
          # Resolve dynamic webhook URL via the explicit matrix mapping (no toUpper available in expressions)
          WEBHOOK_URL: ${{ env[matrix.webhook_key] }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            echo "Pinging webhook for ${APP_NAME} -> ${WEBHOOK_URL}"
            curl -fsSL -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg image "ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:sha-${{ github.sha }}" \
                               --arg ref "${{ github.ref }}" \
                               --arg commit "${{ github.sha }}" \
                               --arg app "${{ matrix.app }}" \
                               '{app:$app,image:$image,ref:$ref,commit:$commit,timestamp:env.GITHUB_RUN_ID}')"
            echo "Webhook ping complete."
          else
            UPPER_APP=$(echo "$APP_NAME" | tr '[:lower:]' '[:upper:]')
            echo "No webhook URL set (expected env WEBHOOK_URL_${UPPER_APP}); skipping."
          fi
