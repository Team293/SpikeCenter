name: CI

on:
  push:
    branches:
      - production
      - staging

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PNPM_VERSION: 10.14.0
  NODE_VERSION: 18.x
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        run: pnpm run lint

  prebuild:
    name: Prebuild monorepo applications
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: prebuild-pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            prebuild-pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate environment files
        run: |
          set -euo pipefail
          for APP in auth landing learn scout nitro-api; do
            mkdir -p "apps/$APP"
            {
              echo "BETTER_AUTH_URL=${BETTER_AUTH_URL}"
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}"
              echo "NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}"
              echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
              echo "NODE_TLS_REJECT_UNAUTHORIZED=0"
              echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
              echo "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
            } > "apps/$APP/.env"
            cp "apps/$APP/.env" "apps/$APP/.env.production"
            echo "Created env files for $APP"
          done
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}

      - name: Turbo prebuild all deployable apps
        run: |
          pnpm turbo run build --filter=./apps/auth --filter=./apps/landing --filter=./apps/learn --filter=./apps/scout --filter=./apps/nitro-api

      - name: List built artifacts
        run: |
          ls -1 apps/auth/.next || true
          ls -1 apps/landing/.next || true
          ls -1 apps/learn/.next || true
          ls -1 apps/scout/.next || true
          ls -1 apps/nitro-api/.output || true

      - name: Package build artifacts
        run: |
          set -euo pipefail
            mkdir -p dist-artifacts
          for APP in auth landing learn scout; do
            if [ -d "apps/$APP/.next" ]; then
              (cd apps/$APP && tar -czf "../../dist-artifacts/next-${APP}.tgz" .next)
              echo "Packaged next-${APP}.tgz"
            else
              echo "Missing .next for $APP" >&2
              exit 1
            fi
          done
          if [ -d "apps/nitro-api/.output" ]; then
            (cd apps/nitro-api && tar -czf "../../dist-artifacts/nitro-api.tgz" .output)
            echo "Packaged nitro-api.tgz"
          else
            echo "Missing .output for nitro-api" >&2
            exit 1
          fi
          ls -lh dist-artifacts

      - name: Upload artifact auth
        uses: actions/upload-artifact@v4
        with:
          name: next-auth
          path: dist-artifacts/next-auth.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact landing
        uses: actions/upload-artifact@v4
        with:
          name: next-landing
          path: dist-artifacts/next-landing.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact learn
        uses: actions/upload-artifact@v4
        with:
          name: next-learn
          path: dist-artifacts/next-learn.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact scout
        uses: actions/upload-artifact@v4
        with:
          name: next-scout
          path: dist-artifacts/next-scout.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact nitro
        uses: actions/upload-artifact@v4
        with:
          name: nitro-api
          path: dist-artifacts/nitro-api.tgz
          if-no-files-found: error
          retention-days: 3

  build-next:
    name: Build & push Next.js images (prebuilt)
    runs-on: ubuntu-latest
    needs: prebuild
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - app: auth
            webhook_key: WEBHOOK_URL_AUTH
          - app: landing
            webhook_key: WEBHOOK_URL_LANDING
          - app: learn
            webhook_key: WEBHOOK_URL_LEARN
          - app: scout
            webhook_key: WEBHOOK_URL_SCOUT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: next-${{ matrix.app }}
          path: artifact-download

      - name: Extract prebuilt artifact
        run: |
          set -e
          mkdir -p apps/${{ matrix.app }}
          tar -xzf artifact-download/next-${{ matrix.app }}.tgz -C apps/${{ matrix.app }}
          test -d "apps/${{ matrix.app }}/.next" || (echo ".next not extracted" && ls -al apps/${{ matrix.app }} && exit 1)

      - name: Verify prebuilt artifact
        run: |
          if [ ! -f "apps/${{ matrix.app }}/.next/BUILD_ID" ] && [ ! -d "apps/${{ matrix.app }}/.next/server" ]; then
            echo "Prebuilt .next directory for ${{ matrix.app }} appears missing or incomplete."
            ls -al apps/${{ matrix.app }}/.next || true
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from prebuilt artifacts
        run: |
          IMAGE=ghcr.io/team293/${{ matrix.app }}
          SHA_TAG=sha-${{ github.sha }}
          echo "Building $IMAGE:$SHA_TAG using prebuilt artifacts"
          docker build \
            --build-arg APP=${{ matrix.app }} \
            --build-arg USE_PREBUILT=true \
            -t $IMAGE:$SHA_TAG \
            -f deploy/next/Dockerfile .
          docker image ls $IMAGE:$SHA_TAG

      - name: Push image (production/staging pushes)
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/team293/${{ matrix.app }}
          SHA_TAG=sha-${{ github.sha }}
          docker push $IMAGE:$SHA_TAG
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:latest
            docker push $IMAGE:latest
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:staging
            docker push $IMAGE:staging
          fi

      - name: Ping webhook (if configured)
        if: github.event_name == 'push'
        env:
          APP_NAME: ${{ matrix.app }}
          WEBHOOK_URL: ${{ env[matrix.webhook_key] }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            echo "Pinging webhook for ${APP_NAME} -> ${WEBHOOK_URL}"
            curl -fsSL -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg image "ghcr.io/team293/${{ matrix.app }}:sha-${{ github.sha }}" \
                               --arg ref "${{ github.ref }}" \
                               --arg commit "${{ github.sha }}" \
                               --arg app "${{ matrix.app }}" \
                               '{app:$app,image:$image,ref:$ref,commit:$commit,timestamp:env.GITHUB_RUN_ID}')"
            echo "Webhook ping complete."
          else
            UPPER_APP=$(echo "$APP_NAME" | tr '[:lower:]' '[:upper:]')
            echo "No webhook URL set (expected env WEBHOOK_URL_${UPPER_APP}); skipping."
          fi

  build-nitro:
    name: Build & push nitro-api image (prebuilt)
    runs-on: ubuntu-latest
    needs: prebuild
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt nitro artifact
        uses: actions/download-artifact@v4
        with:
          name: nitro-api
          path: artifact-download-nitro

      - name: Extract nitro artifact
        run: |
          set -e
          mkdir -p apps/nitro-api
          tar -xzf artifact-download-nitro/nitro-api.tgz -C apps/nitro-api
          test -d "apps/nitro-api/.output" || (echo ".output not extracted" && ls -al apps/nitro-api && exit 1)

      - name: Verify nitro artifact
        run: |
          if [ ! -f "apps/nitro-api/.output/server/index.mjs" ]; then
            echo "Nitro .output missing expected server entry."
            find apps/nitro-api/.output -maxdepth 3 -type f | head -n 50
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nitro image from prebuilt artifacts
        run: |
          IMAGE=ghcr.io/team293/nitro-api
          SHA_TAG=sha-${{ github.sha }}
            echo "Building $IMAGE:$SHA_TAG using prebuilt artifacts"
          docker build \
            --build-arg APP=nitro-api \
            --build-arg USE_PREBUILT=true \
            -t $IMAGE:$SHA_TAG \
            -f deploy/nitro/Dockerfile .
          docker image ls $IMAGE:$SHA_TAG

      - name: Push nitro image (production/staging pushes)
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/team293/nitro-api
          SHA_TAG=sha-${{ github.sha }}
          docker push $IMAGE:$SHA_TAG
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:latest
            docker push $IMAGE:latest
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            docker tag $IMAGE:$SHA_TAG $IMAGE:staging
            docker push $IMAGE:staging
          fi

      - name: Ping webhook (if configured)
        if: github.event_name == 'push'
        env:
          APP_NAME: nitro-api
          WEBHOOK_URL: ${{ env.WEBHOOK_URL_NITRO_API }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            echo "Pinging webhook for ${APP_NAME} -> ${WEBHOOK_URL}"
            curl -fsSL -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg image "ghcr.io/team293/nitro-api:sha-${{ github.sha }}" \
                               --arg ref "${{ github.ref }}" \
                               --arg commit "${{ github.sha }}" \
                               --arg app "${APP_NAME}" \
                               '{app:$app,image:$image,ref:$ref,commit:$commit,timestamp:env.GITHUB_RUN_ID}')"
            echo "Webhook ping complete."
          else
            echo "No webhook URL set (expected env WEBHOOK_URL_NITRO_API); skipping."
          fi
